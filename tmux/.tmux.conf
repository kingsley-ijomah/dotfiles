# ~/.tmux.conf

# ===== Core Settings =====
set -g prefix C-a                    # Change prefix to Ctrl+a
unbind C-b                           # Unbind default Ctrl+b
bind C-a send-prefix                 # Send Ctrl+a to apps when pressed twice

set -g mouse on                      # Enable mouse support
set -g base-index 1                  # Start window numbering at 1
setw -g pane-base-index 1            # Start pane numbering at 1
set -g renumber-windows on           # Renumber windows when one is closed
set -g history-limit 50000           # Scrollback buffer size

# ===== Neovim Compatibility =====
set -sg escape-time 0                # No delay for escape key
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ===== Keybindings =====
# Easy splits (| and -)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Ctrl+hjkl
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Quick reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ===== Catppuccin Theme =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux#v1.0.3'

# Session persistence
set -g @continuum-restore 'on'        # Auto-restore on tmux start
set -g @resurrect-capture-pane-contents 'on'

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"

# Status bar position and style
set -g status-position bottom
set -g status-interval 1

# Left side: session name
set -g status-left-length 50
set -g status-left "#{E:@catppuccin_status_session}"

# Right side: directory + time (no hostname)
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_date_time}"

# Date/time format - clean and minimal
set -g @catppuccin_date_time_text "%H:%M · %b %d"

# Directory shows current folder name
set -g @catppuccin_directory_text "#{b:pane_current_path}"

# Window styling
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_number_position "left"

# Initialize TPM (must be at the bottom)
run '~/.tmux/plugins/tpm/tpm'
