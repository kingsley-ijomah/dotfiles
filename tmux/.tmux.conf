# ~/.tmux.conf

# ===== Core Settings =====
set -g prefix C-a                    # Change prefix to Ctrl+a
unbind C-b                           # Unbind default Ctrl+b
bind C-a send-prefix                 # Send Ctrl+a to apps when pressed twice

set -g mouse on                      # Enable mouse support
set -g base-index 1                  # Start window numbering at 1
setw -g pane-base-index 1            # Start pane numbering at 1
set -g renumber-windows on           # Renumber windows when one is closed
set -g history-limit 50000           # Scrollback buffer size

# ===== Neovim Compatibility =====
set -sg escape-time 0                # No delay for escape key
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ===== Keybindings =====
# Easy splits (| and -)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Ctrl+hjkl
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Quick reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ===== Plugins =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Session persistence
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# ===== Status Bar Style =====
set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'

# Left: session name
set -g status-left-length 40
set -g status-left '#[fg=#1e1e2e,bg=#89b4fa,bold]  #S #[fg=#89b4fa,bg=#1e1e2e]'

# Right: directory + date/time
set -g status-right-length 100
set -g status-right '#[fg=#45475a]#[fg=#cdd6f4,bg=#45475a]  #{b:pane_current_path} #[fg=#89b4fa,bg=#45475a]#[fg=#1e1e2e,bg=#89b4fa,bold]  %H:%M  %b %d '

# Window status
set -g window-status-format '#[fg=#6c7086,bg=#1e1e2e]  #I:#W '
set -g window-status-current-format '#[fg=#1e1e2e,bg=#a6e3a1]#[fg=#1e1e2e,bg=#a6e3a1,bold] #I:#W #[fg=#a6e3a1,bg=#1e1e2e]'
set -g window-status-separator ''

# Pane borders
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'

# Message style
set -g message-style 'fg=#1e1e2e bg=#f9e2af bold'

# Initialize TPM (must be at the bottom)
run '~/.tmux/plugins/tpm/tpm'
